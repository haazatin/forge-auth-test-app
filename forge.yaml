schema_version: 1
application:
  name: forge-auth-test-app
  primary_service: app
runtime:
  language: typescript
  node_version: "22"
  package_manager: npm
  port: 8080
commands:
  build: npm run build
  start: npm start
  test: npm test
probes:
  liveness_path: /healthz
  readiness_path: /readyz
dependencies:
  postgres:
    type: postgresql
    required: true
    environment_variable: DATABASE_URL
  sendgrid:
    type: external_http_api
    required: true
    environment_variables:
      - SENDGRID_API_KEY
      - SENDGRID_API_BASE_URL
      - TRANSACTIONAL_EMAIL_FROM
      - TRANSACTIONAL_EMAIL_FROM_NAME
organization_profile:
  status: absent
  path: .forge/organization-profile.md
  applicable_rules: []
  approved_service_bindings: []
  unresolved_decisions: []
